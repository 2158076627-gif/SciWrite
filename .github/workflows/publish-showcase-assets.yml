name: Publish original showcase assets

on:
  push:
    branches: [main]
    paths:
      - .github/showcase-transfer/manifest.json

permissions:
  contents: write

concurrency:
  group: sciwrite-showcase-assets
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == '2158076627-gif/SciWrite'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the transfer commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate and assemble original files
        run: python3 .github/showcase-transfer/assemble.py

      - name: Commit original documents and remove temporary chunks
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            examples/progress-report/Robot-Assembly-Progress-Report.docx \
            examples/progress-report/Robot-Assembly-Progress-Report.pdf \
            examples/research-plan/Robot_Assembly_Research_Plan.docx \
            examples/research-plan/Robot_Assembly_Research_Plan.pdf
          git rm -r -- .github/showcase-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: publish original example documents'
          git push origin HEAD:main

      - name: Create v1.0.0 only when it does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '%s\n' 'Release v1.0.0 already exists; leaving it unchanged.'
            exit 0
          fi
          # Only an authenticated 404 establishes that the release is absent.
          response="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" 2>/dev/null || true)"
          if ! printf '%s\n' "$response" | grep -Eq '^HTTP/[0-9.]+ 404'; then
            printf '%s\n' 'Cannot confirm that v1.0.0 is absent; no release was created.' >&2
            exit 1
          fi
          test -f docs/release-notes.md
          test -f SciWrite.zip
          gh release create v1.0.0 SciWrite.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title 'SciWrite v1.0.0 · 科研写作技能与示例展示' \
            --notes-file docs/release-notes.md
